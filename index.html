<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide Lab: TEKS 6.9B Virtual Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EAF4F5; --panel:#FFFFFF; --panel2:#F3F9FA; --ink:#0C2B3A; --muted:#48646F; --line:#C5D9DE;
  --accent:#0B6F73; --accent-ink:#FFFFFF; --accent-soft:#D3EDED;
  --good:#17703F; --good-soft:#DDF3E6; --bad:#B3321F; --bad-soft:#FBE4DF; --note-soft:#FFF1CC;
  --space:#0B2233; --space-ink:#E8F1F5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#08171F; --panel:#10293A; --panel2:#0D2231; --ink:#E6F1F5; --muted:#9DB6C2; --line:#244558;
    --accent:#35C0C4; --accent-ink:#06222A; --accent-soft:#123C46;
    --good:#58D08C; --good-soft:#12382A; --bad:#FF8E7C; --bad-soft:#40201C; --note-soft:#3A3217;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08171F; --panel:#10293A; --panel2:#0D2231; --ink:#E6F1F5; --muted:#9DB6C2; --line:#244558;
  --accent:#35C0C4; --accent-ink:#06222A; --accent-soft:#123C46;
  --good:#58D08C; --good-soft:#12382A; --bad:#FF8E7C; --bad-soft:#40201C; --note-soft:#3A3217;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.skip{position:absolute;left:-999px}
.skip:focus{left:12px;top:12px;background:var(--panel);padding:8px 12px;z-index:50}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.5rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
p{margin:.5em 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{background:var(--space);color:var(--space-ink);padding:16px 0 0}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand p{margin:0;color:#A9C4D1;font-size:.9rem}
.reset{background:transparent;border:1px solid #4C7184;color:var(--space-ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.reset:hover{background:#163A50}
.steps{display:flex;gap:6px;overflow-x:auto;padding:14px 18px 0;max-width:1120px;margin:0 auto;scrollbar-width:thin}
.chip{flex:1 0 auto;min-width:112px;background:#12344A;color:var(--space-ink);border:0;border-radius:10px 10px 0 0;padding:10px 12px 12px;text-align:left;cursor:pointer;font-size:.88rem;line-height:1.25;position:relative}
.chip small{display:block;color:#A9C4D1;font-size:.75rem}
.chip[aria-current="step"]{background:var(--bg);color:var(--ink)}
.chip[aria-current="step"] small{color:var(--muted)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip.done::after{content:"\2713";position:absolute;right:10px;top:8px;color:#6BE3A0;font-weight:700}
.chip[aria-current="step"].done::after{color:var(--good)}
.water{height:6px;background:#12344A}
.water i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2B7FD1,#35C0C4);transition:width .4s}

main{padding:22px 0 30px;outline:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 18px}
.mhead{margin:0 0 16px}
.goal{font-size:1.05rem;max-width:68ch;margin:.5em 0}
.mins{color:var(--muted);font-size:.9rem;margin:0}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.two{grid-template-columns:1fr}}
.sim svg,.fig svg{display:block;width:100%;height:auto;border-radius:12px}
.chart svg{display:block;width:100%;height:auto}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:12px 0 0}
.ctl label{font-weight:500}
.ctl input[type=range]{flex:1 1 200px;min-width:140px;accent-color:var(--accent);height:28px}
.ctl output{font-weight:600;min-width:7.5ch}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 0}
.read div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.read span{display:block;color:var(--muted);font-size:.8rem}
.read b{font-size:1.02rem;font-weight:600}
ol.how{margin:.4em 0 0;padding-left:1.3em}
ol.how li{margin:.45em 0;max-width:62ch}
table.data{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.data th{font-weight:600;color:var(--muted);font-size:.82rem}
.empty{color:var(--muted);font-size:.92rem;margin:8px 0}
.mark-ok{color:var(--good);font-weight:600}
.mark-no{color:var(--bad);font-weight:600}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.jump .btn{padding:6px 12px;min-height:38px;font-size:.9rem}
.nameit{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 0;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.nameit label{display:flex;align-items:center;gap:6px}
.todo{list-style:none;margin:10px 0 0;padding:0;font-size:.92rem}
.todo li{padding-left:1.6em;position:relative;margin:3px 0;color:var(--muted)}
.todo li::before{content:"\25CB";position:absolute;left:0}
.todo li.ok{color:var(--good)}
.todo li.ok::before{content:"\2713";font-weight:700}

fieldset.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;margin:0 0 14px;background:var(--panel)}
fieldset.q legend{padding:0 6px;font-weight:600;max-width:70ch}
.qn{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:1.6em;text-align:center;margin-right:6px;font-size:.85rem;padding:0 6px}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--panel2);max-width:70ch}
.opt input{margin-top:.3em;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong,.opt.miss{border-color:var(--bad);background:var(--bad-soft);opacity:.8}
.fb{margin-top:8px;padding:0;max-width:70ch}
.fb.good,.fb.bad,.fb.info{padding:10px 12px;border-radius:10px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.info{background:var(--note-soft)}
.fig{max-width:420px;margin:10px 0}
.numrow{display:flex;flex-wrap:wrap;gap:10px 20px;margin:10px 0}
.numrow label{display:flex;gap:8px;align-items:center}
.numrow input{width:6.5em;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
textarea.cer{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2);line-height:1.5;resize:vertical}
.nameit input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:200px}
dl.vocab{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:8px 0 0;max-width:72ch}
dl.vocab dt{font-weight:600}
dl.vocab dd{margin:0}
@media (max-width:560px){dl.vocab{grid-template-columns:1fr}}
.std{border-left:4px solid var(--accent);padding:6px 14px;margin:10px 0;background:var(--panel2);max-width:72ch}
.note{background:var(--note-soft);border-radius:10px;padding:10px 14px;max-width:72ch;font-size:.95rem}

.navbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.navbar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between}
.gatemsg{flex:1;color:var(--muted);font-size:.9rem;text-align:center}
.gatemsg.ready{color:var(--good);font-weight:600}

.report h2{margin-bottom:6px}
.report table{margin-bottom:10px}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .top,.navbar,.skip,.rbtns,.chip{display:none!important}
  .panel{border:1px solid #999;break-inside:avoid;background:#fff}
}
</style>
</head>
<body>
<a class="skip" href="#stage">Skip to the lab</a>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#12344A"/><path d="M4 26c4-6 7-6 11 0s7 6 11 0 7-6 14 0" fill="none" stroke="#35C0C4" stroke-width="3" stroke-linecap="round"/><circle cx="31" cy="12" r="5" fill="#EDE6BE"/></svg>
      <div><h1>Tide Lab</h1><p>TEKS 6.9B · Grade 6 science · about 60 minutes</p></div>
    </div>
    <button class="reset" id="reset" type="button">Start over</button>
  </div>
  <nav class="steps" id="steps" aria-label="Lab progress"></nav>
  <div class="water" aria-hidden="true"><i id="fill"></i></div>
</header>

<main id="stage" class="wrap" tabindex="-1"></main>

<div class="navbar">
  <div class="wrap">
    <button class="btn alt" id="back" type="button">Back</button>
    <div class="gatemsg" id="gate" role="status"></div>
    <button class="btn" id="next" type="button">Next</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var rad=function(d){return d*Math.PI/180;};
var deg=function(r){return r*180/Math.PI;};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(h){var tot=Math.round(h*60)%1440;var hh=Math.floor(tot/60),mm=tot%60;var ap=hh<12?'AM':'PM';var h12=hh%12===0?12:hh%12;return h12+':'+String(mm).padStart(2,'0')+' '+ap;}
function dayTime(t){return 'Day '+Math.floor(t/24)+', '+fmtTime(t%24);}

var C={space:'#0B2233',ink:'#E8F1F5',sea:'#2B7FD1',land:'#3F8A5B',land2:'#79B67F',moon:'#EDE6BE',moonDark:'#33495A',sun:'#F6B02E',pin:'#FFD23F',line:'#8FB0C0'};

function stars(n,w,h,seed){var s=seed||7,out='';var r=function(){s=(s*16807)%2147483647;return s/2147483647;};
  for(var i=0;i<n;i++){out+='<circle cx="'+(r()*w).toFixed(0)+'" cy="'+(r()*h).toFixed(0)+'" r="'+(0.6+r()*1.1).toFixed(1)+'" fill="#fff" opacity="'+(0.25+r()*0.5).toFixed(2)+'"/>';}
  return out;}

var BLOBS='<path d="M-34 -36 q22 -22 48 -8 q20 16 4 36 q-20 14 -42 4 q-18 -14 -10 -32z"/><path d="M18 26 q16 -8 28 4 q8 14 -6 22 q-18 4 -26 -8 q-4 -10 4 -18z"/><path d="M-52 18 q10 -12 24 -4 q8 12 -4 22 q-14 4 -20 -6z"/>';

function moonG(mx,my,r,sx,sy){var a=deg(Math.atan2(sy-my,sx-mx))-180;
  return '<g transform="translate('+mx.toFixed(1)+' '+my.toFixed(1)+') rotate('+a.toFixed(1)+')"><circle r="'+r+'" fill="'+C.moonDark+'"/><path d="M0 '+(-r)+' A'+r+' '+r+' 0 0 0 0 '+r+' Z" fill="'+C.moon+'"/></g>';}

/* ---------- state ---------- */
var STEPS=[
  {id:'start',title:'Start',sub:'5 min'},
  {id:'m1',title:'Mission 1',sub:'Daily tides · 12 min'},
  {id:'m2',title:'Mission 2',sub:'Spring and neap · 15 min'},
  {id:'m3',title:'Mission 3',sub:'Tide chart · 10 min'},
  {id:'m4',title:'Mission 4',sub:'Predict it · 10 min'},
  {id:'check',title:'Exit check',sub:'8 min'},
  {id:'report',title:'Lab report',sub:'turn in'}
];
function freshState(){return {step:0,name:'',period:'',qs:{},m1:{hour:0,rows:[],arrows:false},m2:{day:0,rows:[],pulls:true,mine:''},m3:{t:0,n1:'',n2:''},cer:'',cerChecks:[false,false,false,false]};}
var S=freshState();
var loaded=false;
try{var raw=sessionStorage.getItem('tidelab-6-9b');if(raw){var p=JSON.parse(raw);if(p&&p.qs){S=Object.assign(freshState(),p);loaded=true;}}}catch(e){}
function save(){try{sessionStorage.setItem('tidelab-6-9b',JSON.stringify(S));}catch(e){}}

/* ---------- questions ---------- */
var TIDE_OPTS=['Spring tide, because the Sun, Earth, and Moon are in a line','Neap tide, because the Sun, Earth, and Moon are in a line','Spring tide, because the Sun, Earth, and Moon form a right angle','Neap tide, because the Sun, Earth, and Moon form a right angle'];
var WHY_SPRING='The Sun, Earth, and Moon are in a straight line, so the Sun’s and Moon’s pulls add together. That makes a spring tide, with the biggest difference between high and low tide.';
var WHY_NEAP='The Sun, Earth, and Moon make a right angle, so the Sun and Moon pull the ocean in different directions. That makes a neap tide, with the smallest difference between high and low tide.';
var Q={
  pre1:{step:'start',pred:true,fixed:true,text:'Before you start, how many high tides do you think a beach has in one day?',opts:['1','2','3','4']},
  pre2:{step:'start',pred:true,text:'What do you think is the main cause of ocean tides?',opts:['Wind blowing across the ocean','Gravity from the Moon and Sun','Earth’s tilt','Ocean currents']},

  m1a:{step:'m1',fixed:true,text:'In your model, how many high tides did the beach have in 24 hours?',opts:['1','2','3','4'],ans:1,
    why:'Two. The beach passed through the bulge facing the Moon and then the bulge on the far side, once each, as Earth turned.',
    hint:'Press Play for the full 24 hours and count how many times the gauge reaches its highest level.'},
  m1b:{step:'m1',text:'The Moon pulls hardest on the water on the side of Earth that faces it. Why is there also a high tide on the opposite side of Earth?',
    opts:['The Moon pulls the far-side water less than it pulls the rest of Earth, so that water is left behind and bulges out.','The Sun pulls on the far side of Earth every day.','Waves from the near side wash across the ocean.','Earth’s tilt pushes the water up on that side.'],ans:0,
    why:'Gravity is weaker on the far side, so the far-side water is pulled less than Earth itself. It gets left behind and forms a second bulge.',
    hint:'Turn on Show gravity pulls. Which side gets the shortest arrow?'},
  m1c:{step:'m1',text:'What carries the beach from a high tide to a low tide in your model?',
    opts:['Earth rotates, so the beach moves out of a bulge','The Moon moves closer to the beach','Wind blows the water away','The Sun’s gravity turns off at night'],ans:0,
    why:'Earth spins once about every 24 hours. The bulges stay lined up with the Moon, so the beach rides from a bulge to a low spot and back to a bulge.',
    hint:'Watch the yellow dot as you drag the time slider. What is moving, the ocean bulges or the beach?'},

  m2a:{step:'m2',text:'When the Sun, Moon, and Earth line up in a straight line, what happens to the tides?',
    opts:['High tides get higher and low tides get lower. This is a spring tide.','The tides get smaller. This is a neap tide.','The tides stop for a day.','Only the waves change.'],ans:0,
    why:'The Sun’s and Moon’s pulls add together, so the tidal range (the difference between high and low tide) gets bigger.',
    hint:'Jump to New moon in the sim and read the tidal range.'},
  m2b:{step:'m2',text:'When the Moon is at a right angle to the Sun (first or third quarter), what happens to the tides?',
    opts:['The Sun and Moon pull the ocean in different directions, so the tidal range is smaller. This is a neap tide.','Their pulls add together, so the tides are the biggest of the month.','Their pulls cancel completely, so there are no tides.','Gravity from the Moon is turned off.'],ans:0,
    why:'The pulls work against each other’s bulges. The Moon still wins because it is closer, so tides do not disappear. The tidal range just gets smaller.',
    hint:'Jump to First quarter and compare the tidal range with New moon.'},
  m2c:{step:'m2',text:'At a full moon, Earth is between the Sun and the Moon. Why does a full moon still cause a spring tide?',
    opts:['The Sun, Earth, and Moon are still in a line, so the two bulges line up and get bigger.','A full moon is brighter, so it pulls harder.','The Moon is closer to Earth at full moon.','A full moon always causes neap tides.'],ans:0,
    why:'It does not matter which side of Earth the Moon is on. When all three are in a line, the Sun’s and Moon’s pulls work together. Spring tides happen at both new moon and full moon.',
    hint:'Jump to Full moon and look at the shape of the ocean and the tidal range.'},

  m3a:{step:'m3',fixed:true,text:'Look at any one day on the chart (24 hours). About how many high tides does this beach have?',opts:['1','2','3','4'],ans:1,
    why:'Two. The chart shows two peaks and two valleys each day, just like your Mission 1 model.',hint:'Count the peaks between two day lines.'},
  m3b:{step:'m3',type:'chart'},
  m3c:{step:'m3',fixed:true,text:'About how many days go by between the biggest tides (spring) and the smallest tides (neap) on the chart?',opts:['1 day','3 days','7 days','30 days'],ans:2,
    why:'The chart goes from the biggest tides on Day 0 to the smallest tides around Day 7, about one week. That is a quarter of the Moon’s 29.5-day cycle.',
    hint:'Find where the peaks are tallest and where they are shortest. How many day lines apart are they?'},
  m3d:{step:'m3',fixed:true,text:'High tide is at 6:00 AM today. When will the next high tide be?',opts:['About 12:00 noon','About 6:30 PM','About 11:00 PM','Exactly 6:00 PM'],ans:1,
    why:'High tides are about 12 hours and 25 minutes apart, so the next one is around 6:25 PM. It is not exactly 12 hours because the Moon keeps moving along its orbit while Earth spins.',
    hint:'Use what you saw in the chart: two high tides per day, a little more than 12 hours apart.'},
  m3e:{step:'m3',fixed:true,text:'High tide is at 6:00 AM today. About when is the first high tide tomorrow morning?',opts:['About 5:10 AM','Exactly 6:00 AM','About 6:50 AM','About 8:30 AM'],ans:2,
    why:'Tides follow the Moon. The Moon comes back overhead about 50 minutes later each day, so tides arrive about 50 minutes later each day.',
    hint:'Each day, Earth has to spin a little extra to catch up with the Moon as it moves along its orbit.'},

  m4a:{step:'m4',fig:{type:'tri',delta:0,label:'The Moon is between Earth and the Sun.'},text:'Scenario 1: The Moon is between Earth and the Sun. What kind of tide will Earth have, and why?',opts:TIDE_OPTS,ans:0,why:WHY_SPRING,hint:'Think about the shape the three objects make. Is it a line or an L?'},
  m4b:{step:'m4',fig:{type:'tri',delta:90,label:'The Moon makes an L-shape with the Sun and Earth.'},text:'Scenario 2: The Moon is a quarter of the way around its orbit. What kind of tide will Earth have, and why?',opts:TIDE_OPTS,ans:3,why:WHY_NEAP,hint:'Think about the shape the three objects make. Is it a line or an L?'},
  m4c:{step:'m4',fig:{type:'tri',delta:180,label:'Earth is between the Sun and the Moon.'},text:'Scenario 3: Earth is between the Sun and the Moon. What kind of tide will Earth have, and why?',opts:TIDE_OPTS,ans:0,why:WHY_SPRING,hint:'Remember Mission 2. The Moon can be on either side of Earth.'},
  m4d:{step:'m4',fig:{type:'tri',delta:270,label:'The Moon is three quarters of the way around its orbit.'},text:'Scenario 4: The Moon is three quarters of the way around its orbit. What kind of tide will Earth have, and why?',opts:TIDE_OPTS,ans:3,why:WHY_NEAP,hint:'Think about the shape the three objects make. Is it a line or an L?'},
  m4e:{step:'m4',fig:{type:'daily'},fixed:true,text:'Scenario 5: It is high tide at the beach where the student stands. About how long until the next low tide, as Earth keeps turning?',opts:['About 1 hour','About 6 hours','About 12 hours','About 24 hours'],ans:1,
    why:'High and low tides alternate about every 6 hours (about 6 hours 12 minutes). Earth turns a quarter of the way between a bulge and a flat spot.',hint:'There are two high tides and two low tides in about 24 hours. How are they spaced?'},

  ex1:{step:'check',text:'What is the main cause of ocean tides?',opts:['The gravitational pull of the Moon and Sun','Wind blowing across the ocean','Earth’s tilt on its axis','Ocean currents like the Gulf Stream'],ans:0,
    why:'Tides come from gravity. Wind makes waves, and tilt makes seasons.',hint:'Think about what your models used to make the bulges.'},
  ex2:{step:'check',text:'The Sun is much bigger than the Moon. Why does the Moon have a bigger effect on tides?',opts:['The Moon is much closer to Earth.','The Moon is brighter at night.','The Moon is made of heavier material than Earth.','The Sun’s gravity does not reach Earth.'],ans:0,
    why:'Gravity gets weaker with distance. The Moon is so much closer that its tide-making pull is bigger than the Sun’s, even though the Sun is much larger.',hint:'Look at the length of the Sun’s and Moon’s pull arrows in Mission 2.'},
  ex3:{step:'check',text:'Which statement correctly compares tides and waves?',opts:['Tides are caused by gravity and rise and fall about every 12 hours. Waves are caused mostly by wind.','Tides are caused by wind. Waves are caused by the Moon.','Tides and waves are the same thing.','Waves are caused by gravity. Tides are caused by Earth’s tilt.'],ans:0,
    why:'A beach still has tides on a calm day with no waves, because tides come from gravity.',hint:'Which one needs the Moon and Sun, and which one needs wind?'},

function qState(id){if(!S.qs[id])S.qs[id]={sel:null,tries:0,done:false,correct:false,first:false,wrongs:[],fb:'',fbc:''};
  var st=S.qs[id];if(!st.order&&Q[id].opts){var idx=Q[id].opts.map(function(_,i){return i;});st.order=Q[id].fixed?idx:shuffle(idx);}return st;}

/* ---------- model for chart ---------- */
var T_M=12.4206,T_S=12;
function tideH(t){return 5+2.0*Math.cos(2*Math.PI*t/T_M)+0.92*Math.cos(2*Math.PI*t/T_S);}
function maxIn(a,b){var m=-1e9;for(var t=a;t<=b;t+=0.25){m=Math.max(m,tideH(t));}return m;}
function chartExp(){return {e1:maxIn(0,24),e2:maxIn(168,192)};}

/* ---------- question rendering ---------- */
function qNum(id){return qList(Q[id].step).indexOf(id)+1;}
function qHTML(id){
  var q=Q[id];
  if(q.type==='chart')return chartQHTML(id);
  var st=qState(id);
  var opts=st.order.map(function(oi){
    var cls='opt';
    if(!q.pred){
      if(st.done&&oi===q.ans)cls+=' right';
      else if(st.done&&st.sel===oi)cls+=' wrong';
      else if(st.wrongs&&st.wrongs.indexOf(oi)>-1)cls+=' miss';
    }
    var dis=(!q.pred&&(st.done||(st.wrongs&&st.wrongs.indexOf(oi)>-1)))?' disabled':'';
    return '<label class="'+cls+'"><input type="radio" name="r-'+id+'" data-q="'+id+'" value="'+oi+'"'+(st.sel===oi?' checked':'')+dis+'><span>'+q.opts[oi]+'</span></label>';
  }).join('');
  var btn=(!q.pred&&!st.done)?'<button class="btn" type="button" data-act="check" data-q="'+id+'">Check answer</button>':'';
  var tag=q.pred?'<span class="qn">?</span>':'<span class="qn">'+qNum(id)+'</span>';
  return '<fieldset class="q" id="q-'+id+'"><legend>'+tag+q.text+'</legend>'+(q.fig?figHTML(q.fig):'')+'<div class="opts">'+opts+'</div>'+btn+

}

function checkQ(id){
  var q=Q[id],st=qState(id);
  if(st.sel==null){st.fb='Pick an answer first.';st.fbc='info';updateQ(id);return;}
  st.tries++;
  if(st.sel===q.ans){st.done=true;st.correct=true;st.first=(st.tries===1);st.fb='<strong>Correct.</strong> '+q.why;st.fbc='good';}
  else{
    st.wrongs=(st.wrongs||[]).concat(st.sel);
    if(st.tries>=2){st.done=true;st.correct=false;st.fb='<strong>Not quite.</strong> The best answer is: '+q.opts[q.ans]+' '+q.why;st.fbc='bad';}
    else{st.fb='<strong>Not yet.</strong> '+(q.hint||'Look at your model again and try once more.');st.fbc='bad';st.sel=null;}
  }
  save();updateQ(id);updateNav();
}
function checkChart(id){
  var st=qState(id),e=chartExp();
  var v1=parseFloat($('#n1').value),v2=parseFloat($('#n2').value);
  S.m3.n1=$('#n1').value;S.m3.n2=$('#n2').value;
  if(isNaN(v1)||isNaN(v2)){st.fb='Type a number in both boxes.';st.fbc='info';save();updateQ(id);return;}
  st.tries++;
  var ok1=Math.abs(v1-e.e1)<=0.6,ok2=Math.abs(v2-e.e2)<=0.6;
  if(ok1&&ok2){st.done=true;st.correct=true;st.first=(st.tries===1);st.fb='<strong>Correct.</strong> The highest tide on Day 0 is about '+e.e1.toFixed(1)+' and on Day 7 about '+e.e2.toFixed(1)+'. The Day 0 tide is higher because the Sun, Earth, and Moon are lined up.';st.fbc='good';}
  else if(st.tries>=2){st.done=true;st.correct=false;st.fb='<strong>Not quite.</strong> The highest tide on Day 0 is about '+e.e1.toFixed(1)+' and on Day 7 about '+e.e2.toFixed(1)+'.';st.fbc='bad';}
  else{st.fb='<strong>Not yet.</strong> '+(ok1?'Your Day 0 reading is close. ':ok2?'Your Day 7 reading is close. ':'')+'Drag the scrub slider across that whole day and watch the tide height readout. Look for the top of the peak.';st.fbc='bad';}
  save();updateQ(id);updateNav();
}

function stepMissing(id){
  var m=[];

var M2={cx:350,cy:210,R:130};
function phaseName(d){
  if(d<1.85||d>=27.68)return 'New moon';if(d<5.54)return 'Waxing crescent';if(d<9.23)return 'First quarter';if(d<12.92)return 'Waxing gibbous';
  if(d<16.61)return 'Full moon';if(d<20.3)return 'Waning gibbous';if(d<23.99)return 'Third quarter';return 'Waning crescent';
}
function m2Calc(d){
  var delta=d/29.53*360,phim=180+delta,re=Math.cos(rad(2*phim))+0.46*Math.cos(rad(360)),im=Math.sin(rad(2*phim))+0.46*Math.sin(rad(360));
  var A=Math.hypot(re,im),psi=0.5*deg(Math.atan2(im,re));
  var m=((delta%180)+180)%180,dl=Math.min(m,180-m),dr=Math.abs(m-90);
  var shape=dl<=22?'Straight line':dr<=22?'Right angle':'In between';
  var type=dl<=22?'spring':dr<=22?'neap':'between';
  return {delta:delta,phim:phim,A:A,psi:psi,shape:shape,type:type,range:4*A,hi:5+2*A,lo:5-2*A,phase:phaseName(d)};
}

  if(id==='m2')bindM2();
  if(id==='m3')bindM3();
  if(id==='start'){
    $('#nm').addEventListener('input',function(e){S.name=e.target.value;save();updateNav();});
    $('#pd').addEventListener('input',function(e){S.period=e.target.value;save();});
  }
  if(id==='check'){
    $('#cer').addEventListener('input',function(e){S.cer=e.target.value;save();updateNav();});
    document.querySelectorAll('[data-cer]').forEach(function(c){c.addEventListener('change',function(){S.cerChecks[+c.dataset.cer]=c.checked;save();});});
  }
}
function render(){
  var id=STEPS[S.step].id;
  $('#stage').innerHTML=stepHTML(id);
  bindStep(id);updateNav();
  window.scrollTo(0,0);
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-go]');if(!t)return;
  if(t.dataset.go!==undefined){go(+t.dataset.go);return;}
  var a=t.dataset.act;
  if(a==='check')checkQ(t.dataset.q);
  if(a==='checkn')checkChart(t.dataset.q);
  if(a==='print')window.print();
  if(a==='download')saveReport();
  if(a==='clearall'){
    if(!t.dataset.armed){t.dataset.armed='1';t.textContent='Press again to erase everything';setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.textContent='Erase my work from this computer';}},5000);return;}
    stopAnim();S=freshState();save();try{sessionStorage.removeItem('tidelab-6-9b');}catch(err){}render();
    var st=$('#stage');var n=document.createElement('div');n.className='fb good';n.setAttribute('role','status');n.textContent='Your work was erased from this computer. The next student can begin.';st.insertBefore(n,st.firstChild);}
  if(a==='copy'){var txt=reportText(),msg=function(s){var c=$('#copied');if(c)c.textContent=s;};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){msg('Copied. Paste it into your assignment.');},function(){msg('Copy did not work. Use Print or save as PDF instead.');});}
    else msg('Copy did not work. Use Print or save as PDF instead.');}
});
document.addEventListener('change',function(e){
  var r=e.target;
  if(r.matches&&r.matches('input[type=radio][data-q]')){
    var id=r.dataset.q,st=qState(id);st.sel=+r.value;
    if(Q[id].pred){st.done=true;st.correct=false;}
    save();updateNav();
  }
});
$('#back').addEventListener('click',function(){go(S.step-1);});
$('#next').addEventListener('click',function(){go(S.step+1);});
var rs=$('#reset'),rsArmed=false;
rs.addEventListener('click',function(){
  if(!rsArmed){rsArmed=true;rs.textContent='Press again to erase all work';setTimeout(function(){rsArmed=false;rs.textContent='Start over';},4000);return;}
  stopAnim();S=freshState();save();rsArmed=false;rs.textContent='Start over';render();
});

if(loaded&&S.step>maxOpen())S.step=maxOpen();
render();
})();
</script>
</body>
</html>
